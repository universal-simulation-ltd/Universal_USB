<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <!-- ⚠️ THE THEME, BEFORE THE FIRST PIXEL — and it has to be here, inline,
         rather than in the app. `createThemeStore` (the SDK) applies the same
         class at import time, which is early but not this early: this runs
         during head parsing, before the body exists, so a dark-mode user never
         sees a pale frame while the module bundle parses.

         The app's key is its OVERRIDE, from App preferences; absent, the app
         follows Global preferences' `universal:color-scheme` (SDK 0.143). Both
         are read here, or someone whose only choice is the global one gets the
         pale frame first and then a flip.

         ⚠️ THE KEY IS DUPLICATED — `src/stores/themeStore.ts` holds the other
         copy, and renaming one silently puts everybody back on following global. They are
         held together by `scripts/theme.test.mjs` (`npm run test:theme`).

         Light is the default (the suite rule), so this only ever ADDS `dark`. -->
    <script>
      try {
        var pref = localStorage.getItem('unisim-usb-theme')
          || localStorage.getItem('universal:color-scheme') || 'light'
        if (pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {
        /* private mode, storage disabled: light, exactly as the store falls back. */
      }
    </script>
    <meta name="description" content="Universal USB Detector — plug in any USB device and instantly see its USB version, negotiated speed, requested power and more. Runs entirely on your machine. No uploads, no tracking, forever free." />
    <title>Universal USB Detector — see what your USB device really is</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
